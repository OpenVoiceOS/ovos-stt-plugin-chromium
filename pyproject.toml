[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-stt-plugin-chromium"
dynamic = ["version"]
description = "A stt plugin for OVOS using the google chrome browser api"
readme = "readme.md"
license = {text = "Apache-2.0"}
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
keywords = ["mycroft", "ovos", "plugin", "stt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "requests",
    "ovos-plugin-manager>=2.1.1,<3.0.0",
    "ovos-utils>=0.8.4,<1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-stt-plugin-chromium"

[project.entry-points."opm.stt"]
"ovos-stt-plugin-chromium" = "ovos_stt_plugin_chromium:ChromiumSTT"

[project.entry-points."opm.stt.config"]
"ovos-stt-plugin-chromium.config" = "ovos_stt_plugin_chromium:ChromiumSTTConfig"

[tool.setuptools.dynamic]
version = {attr = "ovos_stt_plugin_chromium.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_stt_plugin_chromium*"]

[tool.setuptools.package-data]
ovos_stt_plugin_chromium = ["*.json", "locale/**/*"]
